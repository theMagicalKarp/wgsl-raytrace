[tools]
rust = { version = "1.96", profile = "default", components = "rustfmt,clippy" }

[tasks.default]
description = "Run the full local check: tests, lints and a release build"
depends = ["check", "release"]

[tasks.check]
description = "Run the tests and check formatting and linting without changing any files"
depends = ["fmt", "lint", "test"]

[tasks.fix]
description = "Auto-apply the formatter and linter suggestions"
run = [
  "cargo clippy --fix --all-targets --all-features --allow-dirty --allow-staged",
  "cargo fmt",
]

[tasks.build]
description = "Build the project in debug mode"
run = "cargo build"

[tasks.release]
description = "Build the project in release mode"
run = "cargo build --release"

[tasks.test]
description = "Run the tests"
run = "cargo test --all-features"

[tasks.fmt]
description = "Check the code is formatted"
run = "cargo fmt --check"

[tasks.lint]
description = "Check for linting issues"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.example]
description = "Run a single example scene through the binary, e.g. `mise run example teapot`"
depends = ["release"]
usage = 'arg "<name>" help="Name of the example directory under examples/"'
run = """
#!/usr/bin/env bash
set -euo pipefail

dir="examples/$usage_name"

if [ ! -f "$dir/render.toml" ]; then
  echo "No example named '$usage_name'. Available:" >&2
  find examples -name render.toml | sort | xargs -n1 dirname | xargs -n1 basename >&2
  exit 1
fi

echo "Rendering $dir"
target/release/wgsl-raytrace --config "$dir/render.toml" --output "$dir/render.png"
"""

[tasks.examples]
description = "Run every example scene through the binary"
depends = ["release"]
run = """
#!/usr/bin/env bash
set -euo pipefail

find examples -name render.toml | sort | while read -r config; do
  dir="$(dirname "$config")"
  echo "Rendering $dir"
  target/release/wgsl-raytrace --config "$config" --output "$dir/render.png"
done
"""
