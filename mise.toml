[tools]
rust = { version = "1.96", profile = "default", components = "rustfmt,clippy" }

[tasks.default]
description = "Run the full local check: tests, lints and a release build"
depends = ["check", "release"]

[tasks.check]
description = "Run the tests and check formatting and linting without changing any files"
depends = ["fmt", "lint", "test"]

[tasks.fix]
description = "Auto-apply the formatter and linter suggestions"
run = [
  "cargo clippy --fix --all-targets --all-features --allow-dirty --allow-staged",
  "cargo fmt",
]

[tasks.build]
description = "Build the project in debug mode"
run = "cargo build"

[tasks.release]
description = "Build the project in release mode"
run = "cargo build --release"

[tasks.test]
description = "Run the tests"
run = "cargo test --all-features"

[tasks.fmt]
description = "Check the code is formatted"
run = "cargo fmt --check"

[tasks.lint]
description = "Check for linting issues"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.example]
description = "Preview a single example scene through the binary, e.g. `mise run example teapot`"
depends = ["release"]
usage = """
arg "<name>" help="Name of the example directory under examples/"
flag "--debug" help="Also write the unfiltered frame and the aov buffers to <example>/debug"
"""
run = """
#!/usr/bin/env bash
set -euo pipefail

dir="examples/$usage_name"

if [ ! -f "$dir/render.toml" ]; then
  echo "No example named '$usage_name'. Available:" >&2
  find examples -name render.toml | sort | xargs -n1 dirname | xargs -n1 basename >&2
  exit 1
fi

# --debug wants a directory that already exists, and one per example so that a
# second scene's buffers do not land on the first one's.
debug=()
if [ "${usage_debug:-}" = "true" ]; then
  mkdir -p "$dir/debug"
  debug=(--debug "$dir/debug")
fi

echo "Rendering $dir"
target/release/wgsl-raytrace --preview --config "$dir/render.toml" --output "$dir/render.png" --denoise ${debug[@]+"${debug[@]}"}
"""

[tasks.examples]
description = "Preview every example scene through the binary, Ctrl-C to move on to the next"
depends = ["release"]
usage = 'flag "--debug" help="Also write each unfiltered frame and its aov buffers to <example>/debug"'
run = """
#!/usr/bin/env bash
set -euo pipefail

debug=()
if [ "${usage_debug:-}" = "true" ]; then
  debug=(--debug)
fi

# Read on fd 3 rather than stdin, so that the terminal the preview talks to is
# still the one it inherits.
while read -r config <&3; do
  mise run example "$(basename "$(dirname "$config")")" ${debug[@]+"${debug[@]}"}
done 3< <(find examples -name render.toml | sort)
"""
