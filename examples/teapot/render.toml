[camera]
aspect_ratio = "standard"
image_width = 800
samples = 1000
max_bounces = 64
fov = 30
look_from = [-1.89, 2.29, 10.68]
look_at = [-1.68, 2.39, 4.63]
vup = [0.0, 1.0, 0.0]

[environment]
# Nothing in this scene emits, so the background is the only light in it.
color = [0.70, 0.80, 0.99]

# Teapot 
[[objects]]
shape = "wavefront"
file = "teapot.obj"
group = "Teapot"
material = "lambertian"
albedo = [0.72, 0.72, 0.75]

# Floor
[[objects]]
shape = "wavefront"
file = "teapot.obj"
group = "Plane"
material = "lambertian"
albedo = [0.3, 0.72, 0.3]
