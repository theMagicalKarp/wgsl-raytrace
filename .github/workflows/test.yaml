---
name: 🧪 Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CLICOLOR_FORCE: "true"

jobs:
  check:
    name: fmt, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The golden-image test renders for real, so the test job needs an
      # adapter as much as the scene job below does.
      - name: Install a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - name: Rustfmt Check
        run: mise run fmt
      - name: Run Clippy
        run: mise run lint
      - name: Run tests
        run: mise run test
      - name: Build release
        run: mise run release
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: build
          path: target/release/wgsl-raytrace
          retention-days: 3

  scenes:
    name: scene ${{ matrix.config }}
    needs: [check]
    strategy:
      matrix:
        config:
          - teapot
          - melee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - uses: actions/download-artifact@v8.0.1
        with:
          name: build
          path: target/release
      - run: chmod +x ./target/release/wgsl-raytrace
      - env:
          CONFIG: ${{ matrix.config }}
        run: >
          ./target/release/wgsl-raytrace
          --config "examples/$CONFIG/render.toml"
          --output render.png
          --samples 100
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.config }}-render
          path: render.png
          retention-days: 3
