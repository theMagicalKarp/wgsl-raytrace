---
name: 🧪 Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CLICOLOR_FORCE: "true"

jobs:
  check:
    name: fmt, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Rustfmt Check
        run: mise run fmt
      - name: Run Clippy
        run: mise run lint
      - name: Run tests
        run: mise run test
      - name: Build release
        run: mise run release
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: build
          path: target/release/wgsl-raytrace
          retention-days: 3

